name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Structure and tool checks
        run: |
          python3 tools/audit_structure.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Test, lint and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :core:test :app:lint :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Upload validation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-validation-reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7

  quality-gate:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation dependency to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          assert needs and all(job.get('result') == 'success' for job in needs.values()), needs
          PYTHON
